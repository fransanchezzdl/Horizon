# Pre-commit hooks configuration
# Instala con: pre-commit install
# Ejecuta manualmente con: pre-commit run --all-files

repos:
  # Pylint para análisis de código Python (solo archivos especificados)
  - repo: local
    hooks:
      - id: pylint
        name: Pylint
        entry: python scripts/run_tool_with_fallback.py pylint
        language: system
        types: [python]
        files: ^backend/(daos/|dtos/|services/|exceptions/|main\.py$)
        stages: [pre-commit]
        args:
          - --rcfile=.pylintrc
          - --exit-zero
        exclude: ^backend/migrations/|\.pyc$
      - id: pytest-unit
        name: Pytest unit (tests/unit)
        entry: python -u scripts/run_tool_with_fallback.py pytest tests/unit -q --disable-warnings -ra
        language: system
        pass_filenames: false
        files: ^(backend/(daos/|dtos/|services/|exceptions/|main\.py$)|tests/unit/)
        stages: [pre-commit]
      - id: pytest-integration
        name: Pytest integration (tests/integration)
        entry: python -u tests/integration/run_integration.py
        language: system
        pass_filenames: false
        files: ^(backend/(daos/|dtos/|services/|exceptions/|main\.py$)|tests/integration/)
        stages: [pre-commit]

  # Verificaciones básicas rápidas
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast
        name: Check Python syntax
        types: [python]
        files: ^backend/(daos/|dtos/|services/|exceptions/|main\.py$)
        stages: [pre-commit]
      - id: check-json
        name: Check JSON

exclude: ^(\.venv|venv|__pycache__|\.git|migrations|backend/routes|backend/models|backend/scripts)
fail_fast: false
