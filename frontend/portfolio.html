<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Horizon</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/portfolio.js"></script>

    <div id="dashboard-contenido">
        
        <header class="page-header">
            <div class="header-titles">
                <h1>Mi Portfolio</h1>
                <div class="balance-info">
                    <span class="balance-label">Activos:</span>
                    <span class="balance-amount">Cargando...</span>
                    <span class="badge badge-success-light" id="portfolioCountBadge"></span>
                </div>
            </div>
            <button class="btn-primary" onclick="showAddAssetModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Añadir Inversión
            </button>
        </header>

        <section class="metrics-grid">
            <div class="card metric-card">
                <div class="metric-header">
                    <span class="metric-title">Ganancia Total</span>
                    <svg class="icon-trend-up" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div class="metric-body">
                    <span class="metric-value">+$12,400</span>
                    <span class="metric-sub text-success">+11% retorno</span>
                </div>
            </div>

            <div class="card metric-card">
                <div class="metric-header">
                    <span class="metric-title">Cambio Diario</span>
                    <svg class="icon-trend-up" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div class="metric-body">
                    <span class="metric-value">+$350</span>
                    <span class="metric-sub text-success">+0.8% hoy</span>
                </div>
            </div>

            <div class="card metric-card">
                <div class="metric-header">
                    <span class="metric-title">Salud del Portfolio</span>
                    <svg class="icon-shield" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <div class="metric-body">
                    <span class="metric-value">Excelente</span>
                    <span class="metric-sub text-muted">Bajo riesgo</span>
                </div>
            </div>
        </section>

        <section class="card table-section">
            <div class="table-toolbar">
                <h2>Activos en Cartera</h2>
                <button class="btn-outline">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filtrar
                </button>
            </div>

            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th class="text-left">Activo</th>
                            <th class="text-left">Precio Actual</th>
                            <th class="text-left">Estabilidad</th>
                            <th class="text-left">Tamaño</th>
                            <th class="text-left">Estrategia</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los activos se cargarán dinámicamente desde la BD -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>
</body>
</html>
