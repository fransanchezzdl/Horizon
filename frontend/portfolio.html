<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Horizon</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/portfolio.js"></script>

    <div id="dashboard-contenido">
        
        <header class="page-header">
            <div class="header-titles">
                <h1>Mi Portfolio</h1>
                <div class="balance-info">
                    <span class="balance-label">Activos:</span>
                    <span class="balance-amount">Cargando...</span>
                    <span class="badge badge-success-light" id="portfolioCountBadge"></span>
                </div>
            </div>
            <button class="btn-primary" onclick="showAddAssetModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Añadir Inversión
            </button>
        </header>

        <!-- Portfolio Selector -->
        <section class="card portfolio-selector" id="portfolioSelectorContainer">
            <div class="portfolio-selector-content">
                <label for="portfolioSelector" class="portfolio-selector-label">Mis Portfolios</label>
                <div class="portfolio-selector-controls">
                    <select id="portfolioSelector" class="portfolio-selector-select">
                        <option value="">Cargando...</option>
                    </select>
                    <span id="portfolioRiskBadge" class="badge badge-blue"></span>
                    <button class="btn-primary" onclick="createNewPortfolio()" style="padding: 8px 16px; font-size: 13px;">
                        + Nuevo Portfolio
                    </button>
                </div>
            </div>
        </section>

        <section class="metrics-grid">
            <div class="card metric-card">
                <div class="metric-header">
                    <span class="metric-title">Ganancia Total</span>
                    <svg class="icon-trend-up" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div class="metric-body">
                    <span class="metric-value">+$12,400</span>
                    <span class="metric-sub text-success">+11% retorno</span>
                </div>
            </div>

            <div class="card metric-card">
                <div class="metric-header">
                    <span class="metric-title">Cambio Diario</span>
                    <svg class="icon-trend-up" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div class="metric-body">
                    <span class="metric-value">+$350</span>
                    <span class="metric-sub text-success">+0.8% hoy</span>
                </div>
            </div>

            <div class="card metric-card">
                <div class="metric-header">
                    <span class="metric-title">Salud del Portfolio</span>
                    <svg class="icon-shield" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <div class="metric-body">
                    <span class="metric-value">Excelente</span>
                    <span class="metric-sub text-muted">Bajo riesgo</span>
                </div>
            </div>
        </section>

        <section class="card table-section">
            <div class="table-toolbar">
                <h2>Activos en Cartera</h2>
                <button class="btn-outline">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filtrar
                </button>
            </div>

            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th class="text-left">Activo</th>
                            <th class="text-left">Precio Actual</th>
                            <th class="text-left">Estabilidad</th>
                            <th class="text-left">Tamaño</th>
                            <th class="text-left">Estrategia</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los activos se cargarán dinámicamente desde la BD -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Modal: Añadir Activo al Portfolio -->
        <div id="assetModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Añadir Activo al Portfolio</h3>
                    <button class="btn-close" onclick="closeAddAssetModal()">×</button>
                </div>
                <div class="modal-body">
                    <!-- Búsqueda de Activos -->
                    <div class="form-group">
                        <label for="assetSearch">Buscar Activo</label>
                        <div class="input-wrap" style="position: relative;">
                            <span class="search-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                            </span>
                            <input 
                                id="assetSearch" 
                                class="search-input" 
                                type="text" 
                            
                                autocomplete="off"
                                style="text-transform: uppercase;"
                            >
                            <ul id="assetSuggestions" class="suggestions" hidden></ul>
                        </div>
                        <small style="color: #999; margin-top: 8px; display: block;">Ejemplos: AAPL, MSFT, GOOGL, AMZN, TSLA</small>
                    </div>
                    
                    <!-- Activo Seleccionado -->
                    <div id="selectedAssetInfo" style="display: none; margin-top: 16px; padding: 12px; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 8px; color: #1e40af;">
                        <strong id="selectedAssetName"></strong>
                        <p id="selectedAssetTicker" style="font-size: 12px; margin-top: 4px;"></p>
                    </div>
                    
                    <!-- Errores -->
                    <div id="tickerError" style="display: none; color: #dc2626; font-size: 13px; margin-top: 10px;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeAddAssetModal()">Cancelar</button>
                    <button id="addAssetBtn" class="btn-primary" onclick="addAssetToPortfolio()" disabled>Añadir Activo</button>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
