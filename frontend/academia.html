<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia | Horizon</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico">
</head>
<body>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/academia.js"></script>
    
    <div id="dashboard-contenido">
        <div class="academy-layout">
            
            <div class="academy-main-content">
                <section class="bienvenida-section">
                    <h1>Academia Horizon IA</h1>
                    <p class="subtitle">Tu centro de formación financiera inteligente.</p>
                </section>

                <div class="reflexion-card academy-progress-card">
                    <div class="reflexion-content">
                        <span class="reflexion-label">Tu Progreso Actual</span>
                        <div class="reflexion-quote" id="progreso-texto">¡Comienza tu viaje de aprendizaje!</div>
                        
                        <div class="progress-wrapper">
                            <div class="progress-info">
                                <span>Cursos completados</span>
                                <span id="cursos-completados">0</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" id="progress-fill-academy" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sección de cursos disponibles -->
                <div class="opts-section" id="cursos-grid">
                    <!-- Se llena dinámicamente con academia.js -->
                </div>
            </div>

        </div>
    </div>

    <!-- Modal de Carrusel de Diapositivas -->
    <div id="curriculum-modal" class="curriculum-modal" style="display: none;">
        <div class="curriculum-modal-content">
            <!-- Header Modal -->
            <div class="curriculum-header">
                <h2 id="modal-titulo-curso">Título del Curso</h2>
                <button id="btn-cerrar-modal" class="btn-close-modal">&times;</button>
            </div>

            <!-- Contenedor del Carrusel -->
            <div class="curriculum-carousel">
                <!-- Diapositiva Actual -->
                <div class="carousel-slide">
                    <div id="contenido-diapositiva" class="slide-content">
                        <!-- Contenido HTML de la diapositiva -->
                    </div>
                </div>

                <!-- Timer Indicator (solo visible en 1ª visita) -->
                <div id="timer-indicator" class="timer-indicator">
                    <div class="timer-bar"></div>
                </div>
            </div>

            <!-- Navegación Carrusel -->
            <div class="carousel-nav">
                <button id="btn-anterior" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <div class="carousel-progress">
                    <span id="diapositiva-actual">1</span> / <span id="diapositivas-total">1</span>
                </div>

                <button id="btn-siguiente" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <!-- Chatbot flotante en esquina inferior derecha -->
    <aside id="chatAsesor" class="advisor-sidebar card collapsed">
        <div class="advisor-header">
            <div class="user-avatar">
                <svg class="chat-icon-svg" viewBox="0 0 24 24" fill="none">
                    <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="white"/>
                    <circle cx="8" cy="10" r="1.5" fill="currentColor" opacity="0.3"/>
                    <circle cx="12" cy="10" r="1.5" fill="currentColor" opacity="0.3"/>
                    <circle cx="16" cy="10" r="1.5" fill="currentColor" opacity="0.3"/>
                </svg>
                <div class="status-indicator"></div>
            </div>
            <div class="user-info">
                <p class="user-name">Asesor Horizon</p>
                <p class="user-plan" style="color: #10b981;">En línea</p>
            </div>
            <div class="close-icon">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width: 18px; height: 18px;">
                    <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-bubble ai">¡Hola! Soy tu <b>Asesor Horizon</b>. ¿Cómo puedo ayudarte hoy?</div>
            <div class="chat-bubble user">¡Encantado de conocerte!</div>
        </div>

        <div class="chat-input-wrapper">
            <input type="text" class="search-input-chat" placeholder="Escribe tu duda (máx. 100 caracteres)..." maxlength="100">
            <button id="sendMsg" class="btn-primary" >
                <svg viewBox="0 0 24 24" fill="none" style="width: 20px; height: 20px;">
                    <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16151496 C3.34915502,0.9 2.40734225,0.9 1.77946707,1.4471337 C0.994623095,2.0339648 0.837654326,3.0765491 1.15159189,3.84204602 L3.03521743,10.2830390 C3.03521743,10.4401364 3.19218622,10.5972337 3.50612381,10.5972337 L16.6915026,11.3827207 C16.6915026,11.3827207 17.1624089,11.3827207 17.1624089,10.8355870 L17.1624089,12.0031885 C17.1624089,12.0031885 17.1624089,12.4744748 16.6915026,12.4744748 Z" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </aside>
</body>
</html>
