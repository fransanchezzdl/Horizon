<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Horizon</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js"></script>
    <script src="js/register.js" defer></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <img class="logo-icon" src="assets/icon/logo.png" alt="Logo de Horizon">
            <h1>Horizon</h1>
            <p>Crea una cuenta para empezar</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <!-- Selector de foto de perfil -->
            <div class="form-group">
                <label>Foto de perfil</label>
                <div class="profile-photo-selector">
                    <div class="profile-photos-grid">
                        <!-- Opción 1: Foto predeterminada -->
                        <div class="profile-photo-option" data-photo="https://fzxtliowdmhumnxfskvy.supabase.co/storage/v1/object/public/avatars-default/default/default-1.png" title="Opción 1">
                            <img src="https://fzxtliowdmhumnxfskvy.supabase.co/storage/v1/object/public/avatars-default/default/default-1.png" alt="Foto 1">
                        </div>

                        <!-- Opción 2: Foto predeterminada -->
                        <div class="profile-photo-option" data-photo="https://fzxtliowdmhumnxfskvy.supabase.co/storage/v1/object/public/avatars-default/default/default-2.png" title="Opción 2">
                            <img src="https://fzxtliowdmhumnxfskvy.supabase.co/storage/v1/object/public/avatars-default/default/default-2.png" alt="Foto 2">
                        </div>

                        <!-- Opción 3: Foto predeterminada -->
                        <div class="profile-photo-option" data-photo="https://fzxtliowdmhumnxfskvy.supabase.co/storage/v1/object/public/avatars-default/default/default-3.png" title="Opción 3">
                            <img src="https://fzxtliowdmhumnxfskvy.supabase.co/storage/v1/object/public/avatars-default/default/default-3.png" alt="Foto 3">
                        </div>

                        <!-- Opción 4: Subir foto personalizada -->
                        <div class="profile-photo-option upload" title="Sube tu foto">
                            <label for="profilePhotoUpload" class="upload-label">
                                <span class="plus-icon">+</span>
                            </label>
                            <input type="file" id="profilePhotoUpload" name="profilePhotoUpload" accept="image/*" style="display: none;">
                        </div>
                    </div>
                </div>
                <input type="hidden" id="fotoPerfilUrl" name="foto_perfil" value="">
            </div>

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos">
            </div>

            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Crear cuenta</button>
        </form>
        <div class="login-footer">
            <p class="signup-link">¿Ya tienes cuenta? <a class="card-link" href="login.html">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
